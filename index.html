function applyStaffAdjToOrg(r){
  if(!requirePayEdit()) return false;
  const v = adjView(r);
  if(!v.name) return false;
  const empBefore = findEmpByAdj({name:v.name});
  const before = empBefore ? snapFromEmp(empBefore) : null;
  if(isAdjLeaveEvent(r.event, v.workStatus)){
    const emp = findEmpByAdj(v);
    if(emp){
      EMPLOYEES = EMPLOYEES.filter(e=>e.id!==emp.id);
      r.empId = emp.id;
      r.removed = true;
    }
    pushHrLog({kind:r.event||'离职', name:v.name, eventDate:r.eventDate, summary:(r.event||'离职')+' · 已从全员减员', before, after:null});
    return true;
  }
  let emp = findEmpByAdj(v);
  if(!emp){
    emp = createEmpFromAdj(r);
    EMPLOYEES.push(emp);
  }
  r.empId = emp.id;
  emp.wh = v.wh || emp.wh;
  emp.role = (!looksMoneyCell(v.role) && v.role) ? v.role : emp.role;
  emp.dept = deptFromRole(emp.role) || emp.dept;
  scrubEmpOrgFields(emp);
  if(v.wh || (v.role && !looksMoneyCell(v.role))){
    emp.org = [emp.wh, emp.dept].filter(Boolean).join('-') || emp.org;
  }
  if(v.rank){
    emp.rank = v.rank;
    emp.tier = v.rank;
  }
  if(v.job) emp.job = v.job;
  if(v.titleLevel) emp.titleLevel = v.titleLevel;
  emp.workStatus = adjNormWorkStatus(v.workStatus) || emp.workStatus;
  if(v.perfPct) emp.perfPct = v.perfPct;
  if(v.perfWage!=='' && v.perfWage!=null){
    const n = Number(v.perfWage);
    if(!isNaN(n)) emp.perfWage = n;
  }
  if(v.basePay) emp.jdbx = Number(v.basePay);
  if(r.event==='入职') emp.isNew = true;
  if(r.entry){
    emp.idNo = r.entry.idNo;
    emp.bankNo = r.entry.bankNo;
    emp.bankName = r.entry.bankName;
    emp.bankBranch = r.entry.bankBranch;
  }
  pushHrLog({
    kind: r.event||'调整', name: v.name, eventDate: r.eventDate,
    summary: (r.event||'调整')+' · '+(before?'已回写全员':'入职写入全员'),
    before, after: snapFromEmp(emp)
  });
  return true;
}

function adjExcelColMap(header){
  const map = {};
  header.forEach((h,i)=>{
    const k = String(h==null?'':h).replace(/\s/g,'');
    if(!k) return;
    if(/调整项目|异动类型|调整类型/.test(k) || k==='状态') map.event = i;
    else if(/姓名/.test(k)) map.name = i;
    else if(/调整后仓库/.test(k) || ((/仓库/.test(k) || /仓点/.test(k)) && !/仓管|库存|仓租/.test(k))) map.wh = i;
    else if(/调整后岗位/.test(k) || k==='岗位') map.job = i;
    else if(/薪级|薪档/.test(k)) map.rank = i;
    else if(/职级/.test(k) && !/工资/.test(k)) map.titleLevel = i;
    else if(/工资基数/.test(k) || k==='基数' || k==='计提底薪') map.basePay = i;
    else if(/绩效工资/.test(k)) map.perfWage = i;
    else if(/绩效占比/.test(k)) map.perfPct = i;
    else if(/在职状态/.test(k)) map.workStatus = i;
    else if(/调整日期|异动日期|入职日期|转正日期/.test(k) || k==='日期') map.eventDate = i;
    else if(/调整前出勤/.test(k)) map.beforeDays = i;
    else if(/所属组织|组织架构/.test(k)) map.org = i;
    else if(k==='部门' || /所属部门/.test(k)) map.dept = i;
    else if(/岗位|职位|组别/.test(k) && !/工资|基数|补贴|系数/.test(k)){
      if(map.job==null) map.job = i;
      else if(map.role==null) map.role = i;
    }
  });
  return map;
}
function staffAdjHeaderIsPaySheet(header){
  const blob = (header||[]).map(h=>String(h==null?'':h)).join(' ');
  return /应发工资|实发工资|个税|公积金|岗位工资|基本工资|考勤扣除|计薪出勤/.test(blob);
}
function pickAdjRoleCell(row, map){
  const cands = [map.role, map.role2].filter(i=>i!=null).map(i=>String(row[i]==null?'':row[i]).trim()).filter(Boolean);
  const text = cands.find(v=>!looksMoneyCell(v));
  return text || '';
}
function pickAdjWhCell(row, map){
  const parts = [map.wh, map.org, map.dept].filter(i=>i!=null).map(i=>String(row[i]==null?'':row[i]).trim()).filter(Boolean);
  const hit = parts.find(v=>/仓/.test(v) && !looksMoneyCell(v));
  return hit || (parts[0] && /仓/.test(parts[0]) ? parts[0] : (map.wh!=null ? String(row[map.wh]||'').trim() : ''));
}
function inferAdjEvent(workStatus, event){
  const ev = String(event||'').trim();
  if(['入职','异动','转正','预离职','离职'].includes(ev)) return ev;
  if(/删除|减员|辞退|离职/.test(ev)) return '离职';
  if(workStatus==='预离职') return '预离职';
  if(/离职|删除/.test(String(workStatus||''))) return '离职';
  if(workStatus==='试用') return '入职';
  return '异动';
}
function isAdjLeaveEvent(ev, workStatus){
  const e = String(ev||'');
  const w = String(workStatus||'');
  if(e==='预离职' || w==='预离职') return false;
  return e==='离职' || e==='删除' || /^(离职|删除|减员|辞退)$/.test(w);
}

function staffAdjLooksAoa(aoa){
  if(wageTplLooksAoa(aoa)) return false;
  const hi = (aoa||[]).findIndex(r=>r && r.some(c=>String(c).replace(/\s/g,'').indexOf('姓名')>=0));
  if(hi<0) return false;
  const hdr = aoa[hi]||[];
  if(staffAdjHeaderIsPaySheet(hdr)) return false;
  const map = adjExcelColMap(hdr);
  return map.name!=null && (map.event!=null || map.wh!=null || map.job!=null || map.role!=null || map.workStatus!=null);
}
function ingestStaffAdjAoa(label, aoa){
  STAFF_ADJ_BOOK = {fileName: label||'人员调整', aoa: aoa||[]};
  return applyStaffAdjFromAoa(aoa||[]);
}
function applyStaffAdjFromAoa(aoa){
  const rows = aoa||[];
  const hi = rows.findIndex(r=>r && r.some(c=>String(c).replace(/\s/g,'').indexOf('姓名')>=0));
  if(hi<0) return {ok:false, error:'未识别到表头（需含「姓名」列）'};
  const map = adjExcelColMap(rows[hi]);
  if(map.name==null) return {ok:false, error:'缺少姓名列'};
  STAFF_ADJ.length = 0;
  let nUp = 0, nNew = 0, nDel = 0;
  for(let i=hi+1;i<rows.length;i++){
    const row = rows[i]||[];
    const name = String(row[map.name]==null?'':row[map.name]).trim();
    if(!name) continue;
    const job = map.job==null?'':String(row[map.job]==null?'':row[map.job]).trim();
    const titleLevel = map.titleLevel==null?'':String(row[map.titleLevel]==null?'':row[map.titleLevel]).trim();
    const role = composeAdjRole(job, titleLevel, pickAdjRoleCell(row, map));
    const wh = pickAdjWhCell(row, map);
    const rank = String(row[map.rank]==null?'':row[map.rank]).trim();
    const basePay = Number(String(row[map.basePay]==null?'':row[map.basePay]).replace(/,/g,''))||0;
    const perfWage = map.perfWage==null?'':(Number(String(row[map.perfWage]==null?'':row[map.perfWage]).replace(/,/g,''))||0);
    let workStatus = String(row[map.workStatus]==null?'':row[map.workStatus]).trim() || '在职';
    const perfPct = adjNormPct(map.perfPct==null?'':row[map.perfPct]);
    const event = inferAdjEvent(workStatus, map.event==null?'':row[map.event]);
    if(event==='预离职') workStatus = '预离职';
    const eventDate = parseAdjDate(map.eventDate==null?'':row[map.eventDate]);
    const beforeDays = map.beforeDays==null?'':row[map.beforeDays];
    const snap = adjSnap(name, wh, role, rank, basePay, workStatus, perfPct, {
      job, titleLevel, perfWage, beforeDays, eventDate, tier: rank
    });
    const emp = findEmpByAdj({name});
    const rec = {
      id: nextAdjId(), event, eventDate, fromFile:true, orig: emp ? snapFromEmp(emp) : null, after: snap
    };
    if(event==='入职' && !emp) rec.orig = null;
    STAFF_ADJ.push(rec);
    const existed = !!emp;
    applyStaffAdjToOrg(rec);
    if(rec.removed) nDel++;
    else if(existed) nUp++;
    else nNew++;
  }
  afterAdjOrgSync();
  return {ok:true, nUp, nNew, nDel};
}

function recognizeBizFile(uploadName){
  const full = String(uploadName||'').replace(/\\/g,'/');
  const base = bizFileKey(full);
  const u = bizStem(base);
  if(!u && !full) return null;
  const wh = /江门/.test(full) ? '江门' : (/打品|达品/.test(full) ? '打品' : (/佛山/.test(full) ? '佛山' : ''));
  if(/包材|包装方式/.test(full)){
    const wh2 = wh || '';
    if(wh2==='江门'||wh2==='佛山') return wh2+'包材明细.xlsx';
    return null;
  }
  if(/上架/.test(full) && wh==='打品') return '打品上架单.xlsx';
  if(/上架/.test(full) && (wh==='江门'||wh==='佛山')) return wh+'上架单.xlsx';
  if(/上架/.test(full) && !wh) return '佛山上架单.xlsx';
  if(/沃尔玛/.test(full) && /拣货/.test(full)) return '沃尔玛拣货单.xlsx';
  if(/沃尔玛/.test(full) && /收货|入库/.test(full)) return '沃尔玛收货入库单.xlsx';
  if(/沃尔玛/.test(full)) return '沃尔玛收货拣货.xlsx';
  if(/销退|登记表|退件/.test(full)) return '佛山销退登记表.xlsx';
  if(/复新包材台账|包材台账/.test(full) && (wh==='江门'||wh==='佛山')) return '复新包材台账-'+wh+'中心仓.xlsx';
  if(/复新/.test(full) && (wh==='江门'||wh==='佛山')) return '复新包材台账-'+wh+'中心仓.xlsx';
  if(/人员调整|异动名单|转正名单/.test(full)) return '人员调整.xlsx';
  if(/小时工/.test(full)) return (wh||'')+'小时工工时.xlsx';
  if(/自有员工工时/.test(full)) return '自有员工工时表.xlsx';
  if(/考勤统计|考勤（终版）|考勤\(终版\)|终版/.test(full) && /考勤/.test(full)) return '考勤统计终版.xlsx';
  if(/考勤异常/.test(full)) return '考勤异常表.xlsx';
  if(/绩效系数/.test(full)) return '绩效系数.xlsx';
  if(/其他扣除|扣款明细/.test(full)) return '其他扣除.xlsx';
  if(/发货/.test(base)) return (wh||'佛山')+'发货单.xlsx';
  if(/拣货/.test(base) && !/沃尔玛/.test(full) && (wh==='江门'||wh==='佛山'||wh==='打品')) return wh+'拣货单.xlsx';
  if(/SN|扫码/.test(full) && (wh==='江门'||wh==='佛山')) return wh+'SN扫码.xlsx';
  if(/业务单量|单量/.test(base) && !/包材|包装/.test(full)) return '业务单量.xlsx';
  let best = null, score = 0;
  expectedBizFiles().forEach(exp=>{
    const e = bizStem(exp);
    if(!e || !u) return;
    let sc = 0;
    if(u===e) sc = 100;
    else if(u.includes(e) || e.includes(u)) sc = Math.min(u.length, e.length);
    if(wh && exp.indexOf(wh)===0) sc += 20;
    if(sc>score){ best = exp; score = sc; }
  });
  return score>=4 ? best : null;
}

function findPayHeaderRow(aoa, keys){
  let best=0, sc=-1;
  const max=Math.min((aoa||[]).length, 25);
  for(let i=0;i<max;i++){
    const s = payHeaderScore(aoa[i], keys);
    if(s>sc){ sc=s; best=i; }
  }
  return {hi:best, score:sc};
}
function idxByHeader(hdr, names){
  const cells = (hdr||[]).map(cleanBizText);
  for(let i=0;i<cells.length;i++){
    const h = cells[i];
    if(!h) continue;
    if(names.some(n=>h===n || h.indexOf(n)>=0)) return i;
  }
  return -1;
}
function isMissingPunch(v){ return /缺卡/.test(cleanBizText(v)); }
function extractClockHoursList(v){
  const out = [];
  if(v==null || v==='') return out;
  if(typeof v==='number' && isFinite(v)){
    const h = clockHoursOf(v);
    if(h!=null) out.push(h);
    return out;
  }
  const s = String(v);
  const re = /(\d{1,2})[:：](\d{2})(?::(\d{2}))?/g;
  let m;
  while((m=re.exec(s))){
    out.push(Number(m[1]) + Number(m[2])/60 + (Number(m[3])||0)/3600);
  }
  return out;
}
function clockHoursOf(v){
  if(v==null || v==='') return null;
  if(v instanceof Date && !isNaN(v.getTime())) return v.getHours()+v.getMinutes()/60+v.getSeconds()/3600;
  if(typeof v==='number' && isFinite(v)){
    if(v>=0 && v<1.5) return v*24;
    if(v>1.5 && v<=48) return v % 24;
    if(v>48) return (v % 1)*24;
    if(v===0) return 0;
    return null;
  }
  const list = extractClockHoursList(v);
  return list.length ? list[0] : null;
}
function hoursSpanClock(startH, endH){
  if(startH==null || endH==null || isNaN(startH) || isNaN(endH)) return 0;
  let d = endH - startH;
  if(d < 0) d = 24 - startH + endH;
  return payRound2(d);
}
function punchDayHours(g, h, iVal, j, kVal){
  const missI = isMissingPunch(iVal);
  const missK = isMissingPunch(kVal);
  if(missI && missK) return 0;
  const gList = extractClockHoursList(g);
  const gStart = gList.length ? gList[0] : null;
  const gEnd = gList.length ? gList[gList.length-1] : null;
  let startH, endH;
  if(!missI && !missK){
    startH = clockHoursOf(h);
    endH = clockHoursOf(j);
  }else if(missI && !missK){
    startH = gStart!=null ? gStart : clockHoursOf(h);
    endH = clockHoursOf(j);
  }else{
    startH = clockHoursOf(h);
    endH = gEnd!=null ? gEnd : clockHoursOf(j);
  }
  return hoursSpanClock(startH, endH);
}
function excelDateToISO(v){
  if(v==null || v==='') return '';
  if(v instanceof Date && !isNaN(v.getTime())) return v.toISOString().slice(0,10);
  if(typeof v==='number' && v>20000 && v<80000){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000);
    return d.toISOString().slice(0,10);
  }
  const s = cleanBizText(v).replace(/\./g,'-').replace(/\//g,'-');
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return '';
}
function applyOwnHoursAoa(aoa, srcName){
  const hit = findPayHeaderRow(aoa, ['姓名','员工','缺卡','班次','上班','下班','工时']);
  const hdr = aoa[hit.hi]||[];
  const cName = idxByHeader(hdr, ['姓名','员工姓名','员工']);
  if(cName<0) return 0;
  const cG = 6, cH = 7, cI = 8, cJ = 9, cK = 10;
  const sums = {};
  let n = 0;
  for(let r=hit.hi+1;r<aoa.length;r++){
    const line = aoa[r]||[];
    const name = cleanBizText(line[cName]);
    if(!name || /^合计|小计|总计/.test(name)) continue;
    const hrs = punchDayHours(line[cG], line[cH], line[cI], line[cJ], line[cK]);
    sums[name] = payRound2((sums[name]||0) + hrs);
    n++;
  }
  Object.keys(sums).forEach(name=>{
    const e = findPayEmp(name);
    if(e){
      HOURS_OWN_SUMS[name] = sums[name];
      e.gs = sums[name];
    } else {
      mergeHourlyRows([{name, hours:sums[name], role:'小时工'}]);
    }
  });
  const ownN = Object.keys(HOURS_OWN_SUMS).length;
  const tmpN = (HOURS_TEMP||[]).length;
  HOURS_OWN_LOG = (srcName?('已清洗 '+srcName+' · '):'')+'打卡 '+n+' 行 · 全员工时 '+ownN+' 人 · 未匹配记入小时工（现 '+tmpN+' 人）';
  return n;
}
function applyAttendStatAoa(aoa, srcName){
  const hit = findPayHeaderRow(aoa, ['姓名','病假','事假','入职','出勤']);
  const hdr = aoa[hit.hi]||[];
  const cName = idxByHeader(hdr, ['姓名','员工姓名']);
  if(cName<0) return 0;
  const cSick = (()=>{ const i=idxByHeader(hdr,['病假天数','病假']); return i>=0?i:18; })();
  const cAffair = idxByHeader(hdr, ['事假天数','事假','非在职']);
  const cHire = (()=>{ const i=idxByHeader(hdr,['入职日期','入职时间','入职']); return i>=0?i:23; })();
  const cAttend = idxByHeader(hdr, ['计薪出勤','出勤天数','出勤']);
  let n=0, skipped=0;
  for(let r=hit.hi+1;r<aoa.length;r++){
    const line = aoa[r]||[];
    const name = cleanBizText(line[cName]);
    if(!name || /^合计|小计|总计/.test(name)) continue;
    if(!inYuncangRoster(name)){ skipped++; continue; }
    const e = findPayEmp(name);
    if(!e) continue;
    e.sick = parseBizNum(line[cSick]);
    if(cAffair>=0) e.affair = parseBizNum(line[cAffair]);
    if(cAttend>=0 && parseBizNum(line[cAttend])) e.attend = parseBizNum(line[cAttend]);
    const iso = excelDateToISO(line[cHire]);
    if(iso) e.inDate = iso;
    n++;
  }
  return n;
}
function applyAttendCutAoa(aoa){
  const hit = findPayHeaderRow(aoa, ['姓名','异常','扣款','考勤']);
  const hdr = aoa[hit.hi]||[];
  const cName = idxByHeader(hdr, ['姓名','员工姓名']);
  if(cName<0) return 0;
  const cX = (()=>{ const i=idxByHeader(hdr,['扣款金额','考勤扣除','扣款']); return i>=0?i:23; })();
  const sums = {};
  for(let r=hit.hi+1;r<aoa.length;r++){
    const line = aoa[r]||[];
    const name = cleanBizText(line[cName]);
    if(!name || /^合计|小计|总计/.test(name)) continue;
    if(!inYuncangRoster(name)) continue;
    sums[name] = payRound2((sums[name]||0) + parseBizNum(line[cX]));
  }
  let n=0;
  Object.keys(sums).forEach(name=>{
    const e = findPayEmp(name);
    if(!e) return;
    e.attendCut = sums[name];
    n++;
  });
  return n;
}
function applyCoefAoa(aoa){
  const hit = findPayHeaderRow(aoa, ['姓名','系数','绩效']);
  const hdr = aoa[hit.hi]||[];
  const cName = idxByHeader(hdr, ['姓名','员工姓名']);
  const cCoef = idxByHeader(hdr, ['绩效系数','系数']);
  if(cName<0 || cCoef<0) return 0;
  let n=0;
  for(let r=hit.hi+1;r<aoa.length;r++){
    const line = aoa[r]||[];
    const name = cleanBizText(line[cName]);
    if(!name) continue;
    let coef = parseBizNum(line[cCoef]);
    if(coef>1) coef = coef/100;
    PAY_COEF[name] = coef;
    const e = findPayEmp(name);
    if(e){ e.perfCoef = coef; n++; }
  }
  return n;
}
function applyDeductAoa(aoa){
  const hit = findPayHeaderRow(aoa, ['扣款','责任人','问题件','处置']);
  const hdr = aoa[hit.hi]||[];
  const cName = idxByHeader(hdr, ['姓名','员工姓名','对应人']);
  const cWho = idxByHeader(hdr, ['责任人姓名','责任人']);
  const nameI = cName>=0 ? cName : cWho;
  if(nameI<0) return 0;
  const cReason = idxByHeader(hdr, ['扣款原因','原因']);
  const cKind = idxByHeader(hdr, ['问题件类型','问题件']);
  const cDept = idxByHeader(hdr, ['处置部门','部门']);
  const cAmt = idxByHeader(hdr, ['扣款金额','金额']);
  const rows = [];
  for(let r=hit.hi+1;r<aoa.length;r++){
    const line = aoa[r]||[];
    const name = cleanBizText(line[nameI]);
    if(!name) continue;
    const amt = parseBizNum(cAmt>=0?line[cAmt]:0);
    if(!amt) continue;
    rows.push({
      name,
      reason: cReason>=0?cleanBizText(line[cReason]):'',
      kind: cKind>=0?cleanBizText(line[cKind]):'',
      dept: cDept>=0?cleanBizText(line[cDept]):'',
      who: cWho>=0?cleanBizText(line[cWho]):'',
      amt
    });
  }
  if(!rows.length) return 0;
  DEDUCT_BOOK_ROWS = DEDUCT_BOOK_ROWS.filter(r=>!rows.some(x=>x.name===r.name)).concat(rows);
  const sums = {};
  DEDUCT_BOOK_ROWS.forEach(r=>{ sums[r.name]=(sums[r.name]||0)+Number(r.amt||0); });
  Object.keys(sums).forEach(name=>{
    const e = findPayEmp(name);
    if(e) e.otherCut = payRound2(sums[name]);
  });
  return rows.length;
}
function applySocialAoa(aoa){
  const hit = findPayHeaderRow(aoa, ['姓名','社保','公积金','个税']);
  if(hit.score<2) return 0;
  const hdr = aoa[hit.hi]||[];
  const cName = idxByHeader(hdr, ['姓名','员工姓名']);
  if(cName<0) return 0;
  const cSoc = idxByHeader(hdr, ['社保']);
  const cFund = idxByHeader(hdr, ['公积金']);
  const cTax = idxByHeader(hdr, ['个税','个人所得税']);
  let n=0;
  for(let r=hit.hi+1;r<aoa.length;r++){
    const line = aoa[r]||[];
    const e = findPayEmp(line[cName]);
    if(!e) continue;
    if(cSoc>=0) e.social = parseBizNum(line[cSoc]);
    if(cFund>=0) e.fund = parseBizNum(line[cFund]);
    if(cTax>=0) e.tax = parseBizNum(line[cTax]);
    n++;
  }
  return n;
}
function wageIdx(hdr, names, ban){
  const cells = (hdr||[]).map(cleanBizText);
  for(let i=0;i<cells.length;i++){
    const h = cells[i];
    if(!h) continue;
    if(ban && ban.test(h)) continue;
    if(names.some(n=>h===n)) return i;
  }
  for(let i=0;i<cells.length;i++){
    const h = cells[i];
    if(!h) continue;
    if(ban && ban.test(h)) continue;
    if(names.some(n=>h.indexOf(n)>=0)) return i;
  }
  return -1;
}
function parseOrgWh(org){
  const s = cleanBizText(org);
  if(!s || looksMoneyCell(s)) return '';
  const parts = s.split(/[\/\\·\-—–]/).map(x=>cleanBizText(x)).filter(Boolean);
  const hit = parts.find(p=>/仓/.test(p) && !looksMoneyCell(p));
  if(hit) return hit;
  return /仓/.test(s) ? s : '';
}
function wageTplLooksAoa(aoa){
  if(!aoa || aoa.length<2) return false;
  const hit = findPayHeaderRow(aoa, ['姓名','身份证','所属组织','职位','职级','工资基数','银行卡']);
  const hdr = aoa[hit.hi]||[];
  if(wageIdx(hdr, ['姓名','员工姓名'])<0) return false;
  if(/缺卡/.test((hdr||[]).map(cleanBizText).join(''))) return false;
  const marks = ['身份证','所属组织','职位','职级','工资基数','银行卡','在职状态','收款银行','薪档'];
  let n = 0;
  marks.forEach(k=>{ if(wageIdx(hdr, [k], /缺卡|波次|拣货单|岗位工资/)> -1) n++; });
  return n>=3;
}
function applyWageTplFromAoa(aoa, srcName){
  if(payLocked()){
    window.WAGE_TPL_LOG = '薪资已归档锁定，未覆盖全员。请人事解锁后再导入工资表模板';
    return {ok:false, skipped:true, nNew:0, nUp:0, error:'已归档锁定'};
  }
  if(ALL_STAFF_SEEDED){
    window.WAGE_TPL_LOG = '全员大表已初始化，本次工资表模板未覆盖。增减变更请走「人员调整」';
    return {ok:true, skipped:true, nNew:0, nUp:0, error:'全员大表已初始化，未覆盖。增减变更请走「人员调整」'};
  }
  const rows = aoa||[];
  const hit = findPayHeaderRow(rows, ['姓名','身份证','所属组织','职位','职级','工资基数']);
  const hdr = rows[hit.hi]||[];
  const cName = wageIdx(hdr, ['姓名','员工姓名']);
  if(cName<0) return {ok:false, error:'工资表模板缺少姓名列'};
  const c = {
    idNo: wageIdx(hdr, ['身份证号','身份证'], /缴纳/),
    org: wageIdx(hdr, ['所属组织','组织']),
    wh: wageIdx(hdr, ['仓库','所属仓库','仓库名称'], /仓管|库存/),
    role: wageIdx(hdr, ['职位','岗位'], /工资|基数|补贴|系数/),
    rank: wageIdx(hdr, ['职级'], /工资/),
    tier: wageIdx(hdr, ['薪档']),
    workStatus: wageIdx(hdr, ['在职状态']),
    note: wageIdx(hdr, ['备注']),
    shouldAttend: wageIdx(hdr, ['应出勤']),
    attend: wageIdx(hdr, ['计薪出勤']),
    affair: wageIdx(hdr, ['事假','非在职'], /病假/),
    sick: wageIdx(hdr, ['非在职病假','病假']),
    basePay: wageIdx(hdr, ['工资基数']),
    ageWage: wageIdx(hdr, ['工龄工资']),
    subsidy: wageIdx(hdr, ['其他补贴']),
    inDate: wageIdx(hdr, ['入职日期','入职时间','入职']),
    card: wageIdx(hdr, ['银行卡号']),
    bank: wageIdx(hdr, ['收款银行'], /支行/),
    branch: wageIdx(hdr, ['收款银行支行','开户支行','支行']),
    socAccount: wageIdx(hdr, ['社保缴纳户头']),
    socialCo: wageIdx(hdr, ['社保(公司)','公司社保']),
    social: wageIdx(hdr, ['社保'], /公司|户头|公积金/),
    fund: wageIdx(hdr, ['公积金']),
    tax: wageIdx(hdr, ['个税','个人所得税']),
    perfScore: wageIdx(hdr, ['绩效得分','绩效分数'])
  };
  const txt = (row,i)=> i<0 ? '' : cleanBizText(row[i]);
  const numOrNull = (row,i)=>{
    if(i<0) return null;
    const raw = row[i];
    if(raw==null || raw==='') return null;
    return parseBizNum(raw);
  };
  let nUp=0, nNew=0;
  for(let r=hit.hi+1;r<rows.length;r++){
    const row = rows[r]||[];
    const name = txt(row, cName);
    if(!name || /^合计|小计|总计|序号/.test(name)) continue;
    let e = findPayEmp(name);
    if(!e){
      e = emptyEmpShell();
      e.id = nextNewEmpId();
      e.name = name;
      EMPLOYEES.push(e);
      nNew++;
    } else nUp++;
    const idNo = txt(row, c.idNo); if(idNo) e.idNo = idNo;
    const org = txt(row, c.org); if(org) e.org = org;
    const whCell = txt(row, c.wh);
    const wh = whCell || parseOrgWh(org || e.org);
    if(wh) e.wh = wh;
    const role = txt(row, c.role);
    if(role && !looksMoneyCell(role)){
      e.role = role;
      e.dept = deptFromRole(role) || e.dept;
    }
    const rank = txt(row, c.rank); if(rank && !looksMoneyCell(rank)) e.rank = rank;
    const tier = txt(row, c.tier); if(tier) e.tier = tier;
    const st = txt(row, c.workStatus); if(st) e.workStatus = st;
    const note = txt(row, c.note); if(note) e.note = note;
    const sa = numOrNull(row, c.shouldAttend); if(sa!=null) e.shouldAttend = sa;
    const att = numOrNull(row, c.attend); if(att!=null) e.attend = att;
    const af = numOrNull(row, c.affair); if(af!=null) e.affair = af;
    const sk = numOrNull(row, c.sick); if(sk!=null) e.sick = sk;
    const bp = numOrNull(row, c.basePay); if(bp) e.jdbx = bp;
    const ag = numOrNull(row, c.ageWage); if(ag!=null) e.ageWage = ag;
    const sb = numOrNull(row, c.subsidy); if(sb!=null) e.subsidy = sb;
    const iso = c.inDate>=0 ? excelDateToISO(row[c.inDate]) : '';
    if(iso) e.inDate = iso;
    const card = txt(row, c.card); if(card) e.bankNo = card;
    const bank = txt(row, c.bank); if(bank) e.bankName = bank;
    const branch = txt(row, c.branch); if(branch) e.bankBranch = branch;
    const acc = txt(row, c.socAccount); if(acc) e.socAccount = acc;
    const sco = numOrNull(row, c.socialCo); if(sco!=null) e.socialCo = sco;
    const soc = numOrNull(row, c.social); if(soc!=null) e.social = soc;
    const fund = numOrNull(row, c.fund); if(fund!=null) e.fund = fund;
    const tax = numOrNull(row, c.tax); if(tax!=null) e.tax = tax;
    const ps = numOrNull(row, c.perfScore); if(ps!=null) e.perfScore = ps;
    if(!e.org) e.org = [e.wh, e.dept].filter(Boolean).join('-');
    scrubEmpOrgFields(e);
  }
  const r = {ok:true, nUp, nNew};
  if(nNew+nUp>0) ALL_STAFF_SEEDED = true;
  window.WAGE_TPL_LOG = (srcName?('已读取 '+bizFileKey(srcName)+' · '):'')+'全员底表 新增 '+nNew+' / 更新 '+nUp+(ALL_STAFF_SEEDED?' · 已锁定，后续请走人员调整':'');
  return r;
}
function classifyPayAoa(fileName, sheetName, aoa){
  if(wageTplLooksAoa(aoa)) return 'wageTpl';
  const hitOwn = findPayHeaderRow(aoa, ['缺卡','班次','上班打卡','下班打卡','姓名']);
  const ownHdr = ((aoa[hitOwn.hi]||[]).join(''));
  if(/缺卡/.test(ownHdr) && idxByHeader(aoa[hitOwn.hi]||[], ['姓名','员工姓名','员工'])>=0) return 'ownHours';
  if(findPayHeaderRow(aoa, ['扣款原因','问题件','责任人']).score>=2) return 'deduct';
  const hitCoef = findPayHeaderRow(aoa, ['姓名','系数']);
  if(hitCoef.score>=2 && idxByHeader(aoa[hitCoef.hi]||[], ['系数'])>=0) return 'coef';
  const hitCut = findPayHeaderRow(aoa, ['考勤异常','异常类型','姓名']);
  if(hitCut.score>=2 && /异常/.test((aoa[hitCut.hi]||[]).join(''))) return 'attendCut';
  const hitStat = findPayHeaderRow(aoa, ['病假','事假','姓名']);
  if(hitStat.score>=2 && idxByHeader(aoa[hitStat.hi]||[], ['姓名','员工姓名'])>=0) return 'attendStat';
  const tempRows = ingestHoursTempAoa(aoa);
  if(tempRows.length) return 'tempHours';
  const hitSoc = findPayHeaderRow(aoa, ['姓名','社保','公积金','个税']);
  if(hitSoc.score>=3) return 'social';
  return '';
}
function classifyTableModule(aoa, parsed){
  if(parsed && parsed.kind==='shipIndex') return 'shipIndex';
  if(!aoa || aoa.length<2) return '';
  if(wageTplLooksAoa(aoa)) return 'wageTpl';
  if(staffAdjLooksAoa(aoa)) return 'staffAdj';
  const payKind = classifyPayAoa('', '', aoa);
  if(payKind) return payKind;
  const book = cleanBizBook(aoa);
  if(isPackBook(book)) return 'pack';
  if(isPickBook(book)) return 'pick';
  if(isShipBook(book)) return 'ship';
  if(book && headerIndex(book.headers,'上架库位')>=0) return 'shelf';
  if(book && headerIndex(book.headers,'计提类型')>=0) return 'l2';
  return '';
}
function tryApplyPayAoa(fileName, sheetName, aoa){
  if(!aoa || aoa.length<2) return false;
  const kind = classifyPayAoa(fileName, sheetName, aoa);
  if(!kind) return false;
  if(kind==='wageTpl') return applyWageTplFromAoa(aoa, fileName).ok;
  if(kind==='ownHours') return applyOwnHoursAoa(aoa, bizFileKey(fileName)+'/'+sheetName)>0;
  if(kind==='tempHours'){
    const rows = ingestHoursTempAoa(aoa);
    if(!rows.length) return false;
    applyHoursTempRows(rows, bizFileKey(fileName));
    return true;
  }
  if(kind==='attendStat') return applyAttendStatAoa(aoa, fileName)>0;
  if(kind==='attendCut') return applyAttendCutAoa(aoa)>0;
  if(kind==='coef') return applyCoefAoa(aoa)>0;
  if(kind==='deduct') return applyDeductAoa(aoa)>0;
  if(kind==='social') return applySocialAoa(aoa)>0;
  return false;
}
function ingestPayWorkbook(fileName, wb){
  let n=0;
  (wb.SheetNames||[]).forEach(nm=>{
    if(!nm || nm.charAt(0)==='!' || /说明|封面|目录|帮助/.test(nm)) return;
    const aoa = sheetToAoa(wb.Sheets[nm]);
    if(tryApplyPayAoa(fileName, nm, aoa)) n++;
  });
  return n;
}
function applyPaySourceBooks(){
  const seen = new Set();
  Object.keys(BIZ_BOOKS||{}).forEach(k=>{
    const b = BIZ_BOOKS[k];
    if(!b || seen.has(b)) return;
    seen.add(b);

function findBizBook(fileHint, strict){

  const wantLow = want.toLowerCase();
  const wantStem = wantLow.replace(/\.(xlsx|xls|csv)$/i,'');
  const wantWh = bookWh(fileHint+' '+want);
  const keys = Object.keys(BIZ_BOOKS);
  const namesOf = (k,b)=>{
    const names = [k, b.sourceName, bizFileKey(b.importLabel||'')];
    if(!strict) names.push(b.recognizedAs);
    return names.filter(Boolean);
  };
  for(let i=0;i<keys.length;i++){
    const k = keys[i], b = BIZ_BOOKS[k];
    if(!b) continue;
    const names = namesOf(k,b);
    if(names.some(n=>bizFileKey(n).toLowerCase()===wantLow)) return b;
    if(names.some(n=>bizFileKey(n).replace(/\.(xlsx|xls|csv)$/i,'').toLowerCase()===wantStem)) return b;
  }
  if(strict) return null;
  const rec = recognizeBizFile(fileHint);
  if(rec && BIZ_BOOKS[rec]) return BIZ_BOOKS[rec];
  const stem = bizStem(want);
  let best = null, bestSc = 0;
  keys.forEach(k=>{
    const b = BIZ_BOOKS[k];
    if(!b) return;
    const blob = [k, b.sourceName, b.importLabel, b.recognizedAs].join(' ');
    const ks = bizStem(b.sourceName||k);
    let sc = 0;
    if(ks===stem) sc = 60;
    else if(stem && (ks.includes(stem) || stem.includes(ks))) sc = Math.min(stem.length, ks.length);
    if(String(b.importLabel||'').indexOf(wantStem)>=0) sc = Math.max(sc, 40);

  });

}

function evalBizFormula(formula, book, meta){
  if(!book || !book.headers) return null;

  if(!f || /人工填入/.test(f)) return null;
  if(book.shipAgg && /SUMIF/i.test(f)){
    const mm = f.match(/"([^"]+)"/);
    if(mm){
      const want = cleanBizText(mm[1]);
      let hit = book.shipAgg[want];
      if(hit==null){
        Object.keys(book.shipAgg).forEach(k=>{ if(cellMatch(k, want)) hit = book.shipAgg[k]; });
      }
      if(hit!=null) return hit;
    }
  }
  const timesRatio = /\*\s*比例/.test(f);
  f = f.replace(/\*\s*比例\s*$/,'').trim();
  const headers = book.headers, rows = book.rows||[];
  let m = f.match(/^=?SUMIF\(\s*([^,]+?)\s*,\s*"([^"]*)"\s*(?:,\s*([^)]+?))?\s*\)/i);
  if(m){
    const ci = headerIndex(headers, m[1]);
    const si = headerIndex(headers, m[3]||m[1]);
    if(ci<0 || si<0) return null;
    let sum = 0;
    rows.forEach(r=>{ if(cellMatch(r[ci], m[2])) sum += parseBizNum(r[si]); });
    if(timesRatio){

    const i = colLetterToIdx(m[1]);

  }
  m = f.match(/^=?COUNTA\(\s*([A-Za-z]+)(?::[A-Za-z]+)?\s*\)\s*(?:-\s*(\d+))?/i);
  if(m){
    const i = colLetterToIdx(m[1]);

  Object.keys(pkTypeByWh).forEach(w=>{
    const t = pkTypeByWh[w] && pkTypeByWh[w][pk];
    if(t==='批量' || t==='杂单') found.push(t);
  });
  if(found.length===1) return found[0];
  return '';
}
function classifyPickType(ot, qty, strategy, who, logi){
  if(isKuaiyunPick(ot, who, logi)) return '快运';
  if(qty>=300) return '爆单';
  if(strategy==='批量' || strategy==='杂单') return strategy;
  if(qty>10 && qty<300) return '批量';
  return '杂单';
}
function unifyPickBatchOverMisc(rows, typeI, noI, whOf){
  const flag = {};
  rows.forEach(r=>{
    const pk = noI>=0 ? normPickPart(r[noI]) : '';
    if(!pk) return;
    const t = r[typeI];
    if(t!=='批量' && t!=='杂单') return;
    const k = (whOf(r)||'')+'|'+pk;
    flag[k] = (flag[k]||0) | (t==='批量' ? 1 : 2);
  });
  rows.forEach(r=>{
    const pk = noI>=0 ? normPickPart(r[noI]) : '';
    if(!pk || r[typeI]!=='杂单') return;
    const k = (whOf(r)||'')+'|'+pk;
    if(flag[k]===3) r[typeI] = '批量';
  });
}
function enrichShipAndPick(){
  const all = uniqueBizBooks();
  const ships = all.filter(x=>{
    const blob = x.key+' '+(x.book.sourceName||'')+' '+(x.book.importLabel||'')+' '+(x.book.recognizedAs||'');
    if(/拣货/.test(blob) && !x.book.shipIndex) return false;
    return !!(x.book.shipIndex || /发货/.test(blob));
  });
  const picks = all.filter(x=>!/沃尔玛/.test(x.key+' '+(x.book.sourceName||'')+' '+(x.book.importLabel||'')) && (isPickBook(x.book) || /拣货/.test(x.key+' '+(x.book.sourceName||'')+' '+(x.book.importLabel||'')+' '+(x.book.recognizedAs||''))));
  if(!picks.length) return;
  const freqByWh = {};
  const pkTypeByWh = {};
  ships.forEach(({key, book})=>{
    const wh = shipBookWh(key, book) || '佛山';
    if(!freqByWh[wh]) freqByWh[wh] = {};
    if(!pkTypeByWh[wh]) pkTypeByWh[wh] = {};
    const freq = freqByWh[wh];
    const pkType = pkTypeByWh[wh];
    if(book.shipIndex){
      const ix = book.shipIndex;
      Object.keys(ix.freq||{}).forEach(k=>addShipVerifyFreq(freq, k, ix.freq[k]||0));
      const typed = ix.pkType || {};
      Object.keys(typed).forEach(k=>putPkMark(pkType, k, typed[k]));
      if(!Object.keys(typed).length){
        Object.keys(ix.byNo||{}).forEach(k=>{
          const no = String(k).indexOf('|')>=0 ? String(k).split('|').slice(-1)[0] : k;
          putPkMark(pkType, no, ix.byNo[k]);
        });
      }
      return;
    }
    const h = book.headers||[];
    const M = headerIndex(h,'波次单号')>=0 ? headerIndex(h,'波次单号') : bizColIdx(h,'M',['波次单号']);
    const skuI = headerIndex(h,'商品编码')>=0 ? headerIndex(h,'商品编码') : bizColIdx(h,'X',['商品编码']);
    const noI = headerIndex(h,'拣货单号')>=0 ? headerIndex(h,'拣货单号') : bizColIdx(h,'L',['拣货单号']);
    (book.rows||[]).forEach(r=>{
      addShipVerifyFreq(freq, shipVerifyCode(r[M], r[skuI]), 1);
    });
    book._shipWh = wh;
    book._shipPickNos = (book.rows||[]).map(r=>({no:cleanBizText(r[noI]), code:shipVerifyCode(r[M], r[skuI])}));
  });
  ships.forEach(({book})=>{
    const wh = book._shipWh;
    const freq = wh && freqByWh[wh];
    const pkType = wh && pkTypeByWh[wh];
    (book._shipPickNos||[]).forEach(x=>{
      if(!x.no || !pkType) return;
      putPkMark(pkType, x.no, shipMarkFromFreq(freq[x.code]));
    });
    book._shipPickNos = null;
    book._shipWh = null;
  });
  PICK_ROLLUP = {};
  picks.forEach(({key, book})=>{
    const h = book.headers||[];
    const Hcol = bizColIdx(h,'H',['实拣数量','实拣']);
    const Ncol = bizColIdx(h,'N',['订单类型']);
    const Dcol = bizColIdx(h,'D',['物流类型','物流名称']);
    const letterX = colLetterToIdx('X');
    const Xcol = pickPersonCol(h)>=0 ? pickPersonCol(h) : letterX;
    const noI = headerIndex(h,'拣货单号')>=0 ? headerIndex(h,'拣货单号') : bizColIdx(h,'A',['拣货单号']);
    const idI = headerIndex(h,'人员标识')>=0 ? headerIndex(h,'人员标识') : headerIndex(h,'工号');
    const Z = pickEndTimeCol(h);
    const whCol = headerIndex(h,'仓库');
    let typeI = headerIndex(h,'拣货类型');
    if(typeI<0){ typeI = h.length; h.push('拣货类型'); }
    if(Xcol<0 && idI<0) return;
    const rows = book.rows||[];
    rows.forEach(r=>{
      while(r.length<=typeI) r.push('');
      const wh = pickRowWh(key, book, r, whCol);
      const pk = noI>=0 ? normPickPart(r[noI]) : '';
      const st = resolvePkMark(pk, wh, pkTypeByWh);
      const ot = Ncol>=0 ? cleanBizText(r[Ncol]) : '';
      const qty = parseBizNum(r[Hcol]);
      const logi = Dcol>=0 ? cleanBizText(r[Dcol]) : '';
      const whoName = Xcol>=0 ? cleanBizText(r[Xcol]) : '';
      r[typeI] = classifyPickType(ot, qty, st, whoName, logi);
    });
    unifyPickBatchOverMisc(rows, typeI, noI, r=>pickRowWh(key, book, r, whCol));
    rows.forEach(r=>{
      const t = r[typeI];
      const wh = pickRowWh(key, book, r, whCol);
      const qty = parseBizNum(r[Hcol]);
      const whoName = Xcol>=0 ? cleanBizText(r[Xcol]) : '';
      const idRaw = idI>=0 ? r[idI] : r[letterX];
      const hourly = isPickOutsourceCell(idRaw);
      const own = !hourly;
      const whoX = typeof idRaw==='number' && isFinite(idRaw)
        ? String(Math.trunc(idRaw))
        : cleanBizText(idRaw).replace(/\.0+$/,'');
      const displayName = hourly ? '小时工' : (normPickName(whoName) || normPickName(whoX));
      if(!isPickPersonName(displayName)) return;
      const recKey = (own?'own':'out')+'|'+displayName;
      const roll = PICK_ROLLUP[wh] || {kd:0, pl:0, zd:0, bd:0, days:0, dates:{}, byName:{}};
      const rec = roll.byName[recKey] || {kd:0,pl:0,zd:0,bd:0,dates:{}, own: !!own, displayName, ids:{}};
      rec.own = !!own;
      rec.displayName = displayName;
      if(hourly && whoX) rec.ids[whoX] = true;
      rec.nWorkers = hourly ? Object.keys(rec.ids).length : 1;
      if(t==='快运') rec.kd += qty;
      else if(t==='批量') rec.pl += qty;
      else if(t==='爆单') rec.bd += qty;
      else rec.zd += qty;
      const day = pickDateKey(r[Z]);
      if(day){
        rec.dates[day] = (rec.dates[day]||0) + 1;
        roll.dates[day] = (roll.dates[day]||0) + 1;
      }
      roll.byName[recKey] = rec;
      PICK_ROLLUP[wh] = roll;
    });
  });
  Object.keys(PICK_ROLLUP).forEach(wh=>{
    const roll = PICK_ROLLUP[wh];
    roll.kd = 0; roll.pl = 0; roll.zd = 0; roll.bd = 0;
    Object.values(roll.byName).forEach(rec=>{
      roll.kd += rec.kd; roll.pl += rec.pl; roll.zd += rec.zd; roll.bd += rec.bd;
      rec.days = Object.keys(rec.dates||{}).length;
      rec.nWorkers = rec.own===false ? Object.keys(rec.ids||{}).length : 1;
    });
    roll.days = Object.keys(roll.dates||{}).length;
    const full = pickWhLabel(wh);
    EMPLOYEES.forEach(e=>{
      if(e.wh!==full) return;
      const rec = roll.byName['own|'+e.name] || roll.byName['out|'+e.name] || roll.byName[e.name];
      if(!rec) return;
      e.kd = rec.kd; e.pl = rec.pl; e.zd = rec.zd; e.bd = rec.bd;
      if(rec.days) e.jhts = rec.days;
    });
    const pickP = BONUS_PACKS.find(p=>(p.rateField||p.name)===(wh+'拣货效率计提'));
    if(pickP){
      pickP.effQty = roll.kd+roll.pl+roll.zd+roll.bd;
      if(roll.days) pickP.effDays = roll.days;
    }
  });
}
function packReviewQty(name){
  const wh = /江门/.test(name||'')?'江门':'佛山';
  if(PICK_ROLLUP[wh] && PICK_ROLLUP[wh].zd!=null) return PICK_ROLLUP[wh].zd;

}
function computePackStickerRatio(wh, fileHint){
  const book = findBizBook(fileHint) || findPackBook(wh) || findBizBook(wh+'包材明细.xlsx');
  if(!book) return null;
  const h = book.headers||[];
  const wayI = headerIndex(h,'包装方式');
  const qtyI = headerIndex(h,'单量');
  if(wayI<0 || qtyI<0) return null;
  let total=0, ky=0, stick=0;
  (book.rows||[]).forEach(r=>{
    const q = parseBizNum(r[qtyI]);
    const way = cleanBizText(r[wayI]);
    total += q;
    if(/直接贴单/.test(way)) stick += q;
    else if(/快运/.test(way)) ky += q;
  });
  const other = total - ky - stick;
  let roll = null;
  try{ roll = PICK_ROLLUP[wh]; }catch(err){}
  const den = other + (roll && roll.pl || 0) + (roll && roll.bd || 0);
  if(!den) return null;
  return total / den;
}
function fillDerivedL2(){
  let hasPick = false;
  try{ hasPick = !!(PICK_ROLLUP && Object.keys(PICK_ROLLUP).length); }catch(err){}

  const now = Date.now();
  BONUS_L2.forEach(r=>{
    if(/包装复核/.test(r.name)){
      const v = packReviewQty(r.name);
      if(v==null) return;
      r.qty = String(v);
      if(!r._fileUserSet) r.file = '拣货组奖金包';
      r._qtyFromFile = true;
      r.updatedAt = now;

function applyRuleQty(row){
  const name = row.name||'';
  if(/包装复核/.test(name)){
    let hasPick = false;
    try{ hasPick = !!(PICK_ROLLUP && Object.keys(PICK_ROLLUP).length); }catch(err){}
    if(!hasPick) return null;
    return packReviewQty(name);
  }
  const book = sourceBookOf(row);
  if(/二次上架|批量收货|杂单收货/.test(name) && !isPackL2(row)){
    if(!book) return null;
    if(!book.shelfEnriched) enrichShelfBook(book);
    const t = name.replace(/^(佛山|江门|打品|达品)/,'');
    const h = book.headers||[];
    const typeI = headerIndex(h,'计提类型');
    const D = bizColIdx(h,'D',['数量','件数']);
    if(typeI<0 || D<0) return evalBizFormula(row.xlsx, book, row);
    return (book.rows||[]).reduce((s,r)=> cellMatch(r[typeI], t) ? s+parseBizNum(r[D]) : s, 0);
  }
  if(/吹单|接收退件/.test(name) || /销退登记表/.test(row.file||'')){
    if(!book) return null;
    const filters = [{col:'A', prevMonth:true}];
    const monthCols = ['月份','日期','登记日期','创建时间'];
    const h = book.headers||[];
    const mi = monthCols.map(c=>headerIndex(h,c)).find(i=>i>=0);
    if(mi>=0) filters[0] = {col: h[mi], prevMonth:true};
    else filters[0] = {col:'A', prevMonth:true};
    if(/吹单/.test(name)) filters.push({col:'L', eq:'吹面单'});
    if(/李金宇/.test(name) && !/其他/.test(name)) filters.push({col:'Q', eq:'李金宇'});
    else if(/吹单|接收退件/.test(name)) filters.push({col:'Q', neq:'李金宇'});
    return sumBookIfs(book, 'J', filters);
  }
  if(/二次包装|包材整理/.test(name) || /复新包材台账/.test(row.file||'')){
    if(!book) return null;
    const h = book.headers||[];
    const dateCol = ['月份','日期','日期列'].map(c=>headerIndex(h,c)).find(i=>i>=0);
    const filters = dateCol>=0 ? [{col:h[dateCol], prevMonth:true}] : [{col:'A', prevMonth:true}];
    return sumBookIfs(book, 'K', filters);
  }
  if(isPackL2(row)){
    const v = applyPackQty(row);
    if(v!=null) return v;
  }
  if(!book) return null;
  return evalBizFormula(row.xlsx, book, row);
}
function applyBizFormulas(){
  Object.keys(BIZ_BOOKS).forEach(k=>{
    try{
      if(/上架单/.test(k) && BIZ_BOOKS[k] && !BIZ_BOOKS[k].shelfEnriched) enrichShelfBook(BIZ_BOOKS[k]);
    }catch(err){ console.error('上架清洗失败', k, err); }
  });
  try{ enrichShipAndPick(); }catch(err){ console.error(err); }
  BONUS_L2.forEach(row=>{
    if(isManualL2(row)) return;
    row.qty = '';
    row._qtyFromFile = false;
    row.updatedAt = null;
    if(row.qty2==='qty1*ratio') row.ratioVal = '';
  });
  let n = 0;
  BONUS_L2.forEach(row=>{
    if(isManualL2(row)) return;
    try{
      if(applyOneL2FromSource(row)) n++;
    }catch(err){ console.error('单量计算失败', row && row.name, err); }
  });
  try{ fillDerivedL2(); }catch(err){ console.error(err); }
  try{ applyPaySourceBooks(); }catch(err){ console.error('薪酬源表回填失败', err); }
  return n;
}

function indexShipSheet(sheet, fileName){

  const dense = Array.isArray(sheet);
  let rng;
  try{
    rng = sheet['!ref'] ? XLSX.utils.decode_range(sheet['!ref']) : {s:{r:0,c:0}, e:{r: dense ? Math.max(sheet.length-1,0) : 0, c:80}};
  }catch(err){
    rng = {s:{r:0,c:0}, e:{r:0,c:0}};
  }
  const maxC = Math.min(rng.e.c, 140);
  const keys = ['波次单号','商品编码','货品编码','发货单号','客户单号','拣货单号','仓库名称','仓库','物流名称'];
  let hi = rng.s.r, bestSc = -1;
  const lastH = Math.min(rng.s.r + 20, rng.e.r);
  for(let r=rng.s.r; r<=lastH; r++){
    let sc = 0;
    for(let c=rng.s.c; c<=maxC; c++){
      const t = cleanBizText(sheetGetVal(sheet, r, c, dense));
      if(keys.some(k=>t===k || t.indexOf(k)>=0)) sc++;
    }
    if(sc>bestSc){ bestSc = sc; hi = r; }
  }
  const headers = [];
  for(let c=rng.s.c; c<=maxC; c++) headers[c] = cleanBizText(sheetGetVal(sheet, hi, c, dense));
  const col = names=>{
    for(let c=0;c<headers.length;c++){
      const h = headers[c]||'';
      for(let i=0;i<names.length;i++) if(h===names[i] || (h && h.indexOf(names[i])>=0)) return c;
    }
    return -1;
  };
  const cWave = col(['波次单号','波次']);
  const cSku = col(['商品编码','货品编码','商品代码']);
  const cNo = col(['拣货单号']);
  const cWh = col(['仓库名称','仓库']);
  const cLog = col(['物流名称']);
  const cQty = col(['件数','数量','拣货数量']);
  if(cWave<0 && cSku<0 && cNo<0) return null;
  const defWh = bookWh(fileName)||'佛山';
  const recs = [];
  const shipAgg = {};
  let nRows = 0, whHint = '';
  for(let r=hi+1; r<=rng.e.r; r++){
    const wave = cWave>=0 ? cleanBizText(sheetGetVal(sheet, r, cWave, dense)) : '';
    const sku = cSku>=0 ? cleanBizText(sheetGetVal(sheet, r, cSku, dense)) : '';
    const no = cNo>=0 ? cleanBizText(sheetGetVal(sheet, r, cNo, dense)) : '';
    if(!wave && !sku && !no) continue;
    nRows++;
    let wh = cWh>=0 ? bookWh(sheetGetVal(sheet, r, cWh, dense)) : '';
    if(!wh) wh = defWh;
    if(!whHint) whHint = wh;
    recs.push(wh, wave, sku, no);
    if(cLog>=0){
      const lg = cleanBizText(sheetGetVal(sheet, r, cLog, dense));
      if(lg){
        const q = cQty>=0 ? parseBizNum(sheetGetVal(sheet, r, cQty, dense)) : 0;
        shipAgg[lg] = (shipAgg[lg]||0) + q;
      }
    }
  }
  const freq = {}, byNoSku = {}, byNo = {}, pkType = {};
  const freqWs = {};
  for(let i=0;i<recs.length;i+=4){
    const wave = recs[i+1], sku = recs[i+2];
    if(!wave || !sku) continue;
    const code = recs[i]+'|'+wave+'|'+sku;
    freq[code] = (freq[code]||0)+1;
    freqWs[wave+'|'+sku] = (freqWs[wave+'|'+sku]||0)+1;
  }

    const wh = recs[i], wave = recs[i+1], sku = recs[i+2], no = recs[i+3];
    if(!wave || !sku || !no) continue;

  }
  return {
    kind: 'shipIndex',
    nRows,
    headers: headers.filter(Boolean).slice(0, 12),
    freq, byNoSku, byNo, pkType, shipAgg, whHint: whHint||defWh
  };
}

function parseBizFileToAoa(file){
  const label = importFileLabel(file);
  const fallback = async ()=>{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array', dense:true, cellStyles:false, cellNF:false, cellHTML:false});
    const parsed = workbookToAoa(wb);
    parsed.wb = wb;
    const kind = classifyTableModule(parsed.aoa, parsed);
    if(kind==='ship' || kind==='shipIndex'){
      const sheetName = parsed.sheetName || pickBizSheet(wb);
      const idx = indexShipSheet(wb.Sheets[sheetName]||wb.Sheets[wb.SheetNames[0]], label);
      if(idx && idx.nRows){
        idx.sheetName = sheetName;
        idx.ok = true;
        idx.wb = wb;
        return idx;
      }
    }
    return parsed;
  };
  const runWorker = ()=> new Promise((resolve, reject)=>{
    let settled = false;
    let url = '';
    let w = null;
    const finish = (ok, val)=>{
      if(settled) return;
      settled = true;
      try{ if(w) w.terminate(); }catch(e){}
      if(url) URL.revokeObjectURL(url);
      if(ok) resolve(val); else reject(val);
    };
    try{
      const blob = new Blob([BIZ_XLSX_WORKER_SRC], {type:'text/javascript'});
      url = URL.createObjectURL(blob);
      w = new Worker(url);
      const timer = setTimeout(()=>finish(false, new Error('解析超时')), 900000);
      w.onmessage = ev=>{
        clearTimeout(timer);
        const d = ev.data||{};
        if(d.ok && d.kind==='shipIndex' && d.nRows) finish(true, d);
        else if(d.ok && d.aoa && d.aoa.length) finish(true, {aoa:d.aoa, sheetName:d.sheetName});
        else finish(false, new Error(d.error || '空表'));
      };
      w.onerror = ()=>{
        clearTimeout(timer);
        finish(false, new Error('worker失败'));
      };
      file.arrayBuffer().then(buf=>{
        try{ w.postMessage({buf, fileName: label}, [buf]); }
        catch(err){ try{ w.postMessage({buf, fileName: label}); }catch(e){ finish(false, err); } }
      }).catch(err=>finish(false, err));
    }catch(err){ finish(false, err); }
  }).catch(()=>fallback());
  return fallback();
}
function applyClassifiedSheet(label, sh){

    if(!r || !r.ok) return {ok:false, msg: (r && r.error) || '全员表头不足（需姓名+身份证/组织/职位/职级/工资基数等）'};
    return {ok:true, msg: r.skipped ? '全员大表(已锁定未覆盖)' : '全员大表(新增'+(r.nNew||0)+'/更新'+(r.nUp||0)+')'};
  }

    if(!r || !r.ok) return {ok:false, msg: (r && r.error) || '人员调整表头不足（需姓名+仓库/岗位/在职状态）'};
    return {ok:true, msg:'人员调整(更新'+(r.nUp||0)+'/新增'+(r.nNew||0)+'/删减'+(r.nDel||0)+')'};
  }

  }
  if(kind==='tempHours'){
    const rows = ingestHoursTempAoa(aoa);
    if(!rows.length) return {ok:false, msg:'小时工需姓名+工时列'};
    applyHoursTempRows(rows, bizFileKey(label));
    return {ok:true, msg:'小时工工时('+rows.length+'人)'};
  }
  if(kind==='attendStat'){
    const n = applyAttendStatAoa(aoa, label);
    return n ? {ok:true, msg:'考勤统计'} : {ok:false, msg:'考勤统计未写入'};
  }
  if(kind==='attendCut'){
    const n = applyAttendCutAoa(aoa);
    return n ? {ok:true, msg:'考勤异常'} : {ok:false, msg:'考勤异常未写入'};
  }
  if(kind==='coef'){
    const n = applyCoefAoa(aoa);
    return n ? {ok:true, msg:'绩效系数'} : {ok:false, msg:'绩效系数未写入'};
  }
  if(kind==='deduct'){
    const n = applyDeductAoa(aoa);
    return n ? {ok:true, msg:'其他扣除'} : {ok:false, msg:'扣款未写入'};
  }
  if(kind==='social'){
    const n = applySocialAoa(aoa);
    return n ? {ok:true, msg:'社保公积金'} : {ok:false, msg:'社保表未写入'};
  }
  if(kind==='shipIndex'){
    const book = ingestShipIndex(label, sh.parsed);
    return book ? {ok:true, msg:(book.recognizedAs||'发货单').replace(/\.xlsx$/i,'')+'('+(sh.parsed.nRows||0)+'行)'} : {ok:false, msg:'发货单为空'};
  }
  if(kind==='ship' && sh.parsed && sh.parsed.wb && sh.name){
    const idx = indexShipSheet(sh.parsed.wb.Sheets[sh.name], label);
    if(idx && idx.nRows){
      idx.sheetName = sh.name;
      const book = ingestShipIndex(label, idx);
      return book ? {ok:true, msg:(book.recognizedAs||'发货单').replace(/\.xlsx$/i,'')+'('+idx.nRows+'行)'} : {ok:false, msg:'发货单为空'};
    }
  }
  const book = ingestBizAoa(label, aoa);
  if(book && book.recognizedAs) return {ok:true, msg: book.recognizedAs.replace(/\.xlsx$/i,'')+'('+(aoa||[]).length+'行)'};
  if(book) return {ok:false, msg:'表头未对照到页面模块'};
  return {ok:false, msg:'空表'};
}

function jitiModules(e){
  const z = {pick:0, pack:0, kw:0, recv:0, xt1:0, xt2:0, jdbx:0, gwbt:0};
  const t = jitiTrace(e);
  if(!t || !t.total) return z;
  const role = e.role||'';
  const sumTerms = (re)=> (t.terms||[]).filter(x=>re.test(x.label||'')).reduce((s,x)=>s+Number(x.amount||0),0);
  const vol = sumTerms(/单量/);
  const gs = sumTerms(/工时/);
  const eff = sumTerms(/效率/);
  if(/拣货/.test(role)) z.pick = vol;
  else if(/包装/.test(role) || /发货/.test(role)) z.pack = vol + gs;
  else if(/库维/.test(role)) z.kw = sumTerms(/效率|库维组奖金包总额/);
  else if(/收货/.test(role)) z.recv = vol + gs;
  else if(/销退/.test(role)) z.xt1 = vol + gs;
  z.jdbx = sumTerms(/底薪/);
  z.gwbt = sumTerms(/岗位补贴/);
  if(/销退/.test(role) && t.compare){
    const win = t.compare.find(c=>c.win) || t.compare[0];
    z.gwbt = e.gwbt||0;
    z.jdbx = Math.round(Number(win.amount||0) - vol - gs - z.gwbt);
  }
  return z;
}

// 计提过程：与 computeJiti 完全同逻辑，但按「数量 × 单价」结构化拆解
function jitiTrace(e){
  const fixedRoles = ['快运专员','账务专员','数据专员','行政专员','仓经理'];
  if(fixedRoles.includes(e.role)){
    return {terms:[{label:'职能岗固定薪酬', qty:'—', price:'无计提项', amount:0}], total:0,
      schemeNote:'职能岗固定方案：固定薪酬，无计提'};
  }
  const role = e.role;
  const terms = [];
  const volCoefs = [['快运单量计提','kd',0.1],['批量单量计提','pl',0.1],['杂单单量计提','zd',0.2],['爆单单量计提','bd',0.05]];
  const pushVol = (useAvg)=>{
    volCoefs.forEach(([n,k,c])=>{
      if(useAvg){
        const av = +avgOfGroup(role.replace('组长','专员'), e.dept, e.wh, k).toFixed(2);
        terms.push({label:n+'（组员均值）', qty:av.toLocaleString()+' 单', price:c+' 元/单', note:'出勤≥20天组员均值', amount:av*c});
      }else{
        terms.push({label:n, qty:(e[k]||0).toLocaleString()+' 单', price:c+' 元/单', amount:(e[k]||0)*c});
      }
    });
  };
  const gsTerm = ()=>({label:'工时奖金', qty:e.gs+' 时', price:e.dgsj+' 元/时', amount:e.gs*e.dgsj});
  const jdbxTerm = ()=>({label:'计提底薪', qty:'—', price:'固定值', amount:e.jdbx});
  const gwbtTerm = ()=>({label:'岗位补贴', qty:'—', price:'固定值', amount:e.gwbt});
  let schemeNote = '';
  if(role==='拣货组长'){
    pushVol(true);
    terms.push(jdbxTerm());
    schemeNote = '拣货组长计提方案：合格组员（出勤≥20天）单量均值 × 单价 ＋ 计提底薪';
  }else if(role==='库维组长'||role==='库维专员'){
    const g = kwGroupBiz(e.wh);
    const fname = kwTotalField(e.wh);
    terms.push({
      label: fname,
      qty: g.pending ? '待读取' : ((g.pick.amt||0)+' ＋ '+(g.recv.amt||0)),
      price: '拣货效率计提 ＋ 收货效率计提',
      note: '引用组拣货单量/天数、收货方数/天数，逻辑未配置时为空',
      amount: g.pending?0:g.per
    });
    terms.push(jdbxTerm());
    if(role==='库维组长') terms.push(gwbtTerm());
    schemeNote = '库维组计提：'+fname+' ＋ 计提底薪'+(role==='库维组长'?' ＋ 岗位补贴':'');
  }else if(role==='销退专员'){
    pushVol(false);
    terms.push(gsTerm());
    const base = terms.reduce((s,t)=>s+t.amount,0);
    const l1 = base+5600+e.gwbt, l2 = base+e.jdbx+e.gwbt;
    return {terms, total:Math.round(Math.max(l1,l2)), subLabel:'小计',
      compare:[
        {label:'逻辑1：小计 ＋ 固定底薪 5600 ＋ 岗位补贴', expr:base.toFixed(2)+' ＋ 5600 ＋ '+e.gwbt, amount:l1, win:l1>=l2},
        {label:'逻辑2：小计 ＋ 计提底薪 '+e.jdbx+' ＋ 岗位补贴', expr:base.toFixed(2)+' ＋ '+e.jdbx+' ＋ '+e.gwbt, amount:l2, win:l2>l1},
      ],
      schemeNote:'销退专员计提方案：两条逻辑并行计算，取高值'};
  }else{
    pushVol(false);
    if(role!=='拣货专员') terms.push(gsTerm());
    terms.push(jdbxTerm());
    if(role.includes('组长')) terms.push(gwbtTerm());
    schemeNote = role+'计提方案：单量×单价'+(role==='拣货专员'?'':' ＋ 工时×单工时奖金')+' ＋ 计提底薪'+(role.includes('组长')?' ＋ 岗位补贴':'');
  }
  const total = terms.reduce((s,t)=>s+t.amount,0);
  return {terms, total:Math.round(total), schemeNote};
}

// 全链路过程：与 computeSalary 完全同逻辑，按薪资元素逐项拆解
function updEmpPay(id, key, val){
  if(!requirePayEdit()) return;
  const e = EMPLOYEES.find(x=>x.id===id);
  if(!e) return;
  if(key==='correctHide') e.correctHide = !!val;
  else if(key==='correctReason') e.correctReason = String(val||'');
  else e[key] = parseFloat(val)||0;
  evaluateWarnings();
  refreshView();
}
function salaryTrace(e){

  const affairBase = (s.jiti>0 && !isAffairBaseRole(e.role)) ? '绩效工资' : '工资基数';
  const deductNote = DEDUCT_BOOK_ROWS.filter(r=>r.name===e.name).map(r=>[r.reason,r.kind,r.dept,r.who,r.amt].filter(Boolean).join(' / ')).join('；');
  const yfRows = [
    {label:'基础工资', qty:'固定', price:'3000', amount:PAY_BASIC},
    {label:'绩效工资（拆分，不重复加）', qty:'工资基数 '+payBaseOf(e)+' × 系数', price:String(e.perfWage||0), amount:0, note:'计入应发的是下方考核奖惩'},
    {label:'岗位工资', qty:'工资基数 − 3000 − 绩效工资', price:'余数', amount:e.post||0},
    {label:'考核奖惩', qty:'绩效工资 '+ (e.perfWage||0), price:'× 得分 '+e.perfScore+'/100', amount:s.reward||0},
    {label:'工龄工资', qty:'—', price:'见表 / 人事', amount:e.ageWage||0},
    {label:'其他补贴', qty:'—', price:'模板导入', amount:e.subsidy||0},
    {label:'计提工资', qty:'—', price:'见「① 计提过程」', amount:jt.total},
    {label:'转正/异动调差', qty:(adjRecordOf(e)&&adjRecordOf(e).beforeDays)||0, price:'(现基数−原基数)/应出勤×调整前出勤', amount:e.adjust||0},
    {label:'事假扣款', qty:(e.affair||0)+' 天', price:affairBase+'/应出勤×天数', amount:-(e.affairPay||0)},
    {label:'病假扣款', qty:(e.sick||0)+' 天 · 司龄 '+y.toFixed(1)+' 年', price:'3000/应出勤×天数×'+sickRate, amount:-(e.sickPay||0)},
    {label:'考勤扣除', qty:'—', price:'考勤异常表 X 列', amount:-(e.attendCut||0)},
    {label:'纠偏', qty:e.correctHide?'已隐藏':(e.correctReason||'手动'), price:e.correctHide?'不计入应发':'手工录入', amount:e.correctHide?0:(e.correctAmt||0)},
    {label:'其他扣除', qty:'—', price:deductNote||'见表（原因/问题件/部门/责任人/金额）', amount:-(e.otherCut||0)},
  ];
  const yf = yfRows.reduce((s,r)=>s+r.amount,0);
  const sfRows = [
    {label:'应发工资', qty:'—', price:'见「② 应发过程」', amount:yf},
    {label:'个人所得税', qty:'—', price:'代扣代缴', amount:-e.tax},
    {label:'社保（个人部分）', qty:'—', price:'代扣代缴', amount:-e.social},
    {label:'公积金（个人部分）', qty:'—', price:'代扣代缴', amount:-e.fund},
  ];
  const sf = Math.round(sfRows.reduce((s,r)=>s+r.amount,0));
  const costRows = [
    {label:'应发工资', qty:'—', price:'税前', amount:yf},
    {label:'减：个人所得税', qty:'—', price:'员工税负不计入公司人工成本', amount:-e.tax},
    {label:'加：社保（公司承担）', qty:'—', price:'公司缴纳部分', amount:e.socialCo},
  ];
  const cost = Math.round(costRows.reduce((s,r)=>s+r.amount,0));
  return {jt, yfRows, yf, sfRows, sf, costRows, cost, basic:PAY_BASIC+(e.post||0), perf:s.reward};
}

// 分项表：计算项 | 数量/基数 | 单价/规则 | 分项金额（无累计列）
function traceTbl(rows, totalLabel){
  const body = rows.map(r=>{
    const zero = Math.abs(r.amount) < 0.005;
    const note = r.note ? `<div class="small muted">${esc(r.note)}</div>` : '';
    return `<tr class="${zero?'zero':''}">
      <td>${esc(r.label)}${note}</td>
      <td class="num mono">${esc(String(r.qty==null?'—':r.qty))}</td>
      <td class="num mono">${esc(String(r.price==null?'—':r.price))}</td>
      <td class="num mono ${r.amount<0?'neg':''}">${r.amount<0?'−':''}¥${Math.abs(Math.round(r.amount)).toLocaleString()}</td>
    </tr>`;
  }).join('');
  const total = rows.reduce((s,r)=>s+r.amount,0);
  return `<div class="tbl-wrap"><table>
    <thead><tr><th style="width:32%">计算项</th><th class="num" style="width:20%">数量 / 基数</th><th class="num" style="width:22%">单价 / 规则</th><th class="num" style="width:14%">分项金额</th></tr></thead>
    <tbody>${body}<tr class="tr-total"><td>${totalLabel||'合计'}</td><td></td><td></td><td class="num mono">¥${Math.round(total).toLocaleString()}</td></tr></tbody>
  </table></div>`;
}

function resetL2Qty(){
  BONUS_L2.forEach(r=>{
    if(isManualL2(r)) return;
    r.qty = '';
    r._qtyFromFile = false;
    r.updatedAt = null;
    if(r.qty2==='qty1*ratio') r.ratioVal = '';
  });
  BONUS_PACKS.forEach(p=>{
    const f = p.rateField||p.name||'';
    if(/效率计提/.test(f) && !/库维组/.test(f)){
      p.effQty = '';
      if(!/收货/.test(f)) p.effDays = '';
    }
  });
}

function mockEmp(p){
  const e = emptyEmpShell();
  Object.assign(e, p);
  e.dept = e.dept || deptFromRole(e.role);
  e.org = e.org || [e.wh, e.dept].filter(Boolean).join('-');
  if(!e.jdbx) e.jdbx = e.basePay || 5600;
  if(!e.rank) e.rank = 'P2';
  if(!e.workStatus) e.workStatus = '在职';
  if(!e.perfPct) e.perfPct = '15%';
  if(!e.attend) e.attend = 22;
  if(!e.shouldAttend) e.shouldAttend = 26;
  if(!e.gs) e.gs = 176;
  if(e.lastMonth==null) e.lastMonth = Math.max(0, Math.round((e.jdbx||5600)*1.15));
  if(!e.inDate) e.inDate = '2024-03-01';
  e.social = e.social==null ? 420 : e.social;
  e.fund = e.fund==null ? 280 : e.fund;
  e.tax = e.tax==null ? 85 : e.tax;
  e.socialCo = e.socialCo==null ? 980 : e.socialCo;
  return e;
}

function init(){
  // build views
  const content = document.getElementById('content');
  VIEWS.forEach(v=>{
    const d = document.createElement('div');
    d.className='view'+(v.id==='dashboard'?' active':'');
    d.id='view-'+v.id;
    content.appendChild(d);
  });
  if(!loadPayStore()) seedMockPayData(true);
  warnings = evaluateWarnings();
  renderNav();
  renderDashboard(); renderCalcTrace(); renderEmpScheme(); refreshView(); renderElements();
  bindPageFindKeys();
  window.selArch = function(node){ document.querySelectorAll('.arch-node').forEach(n=>n.classList.remove('sel')); node.classList.add('sel'); };
}
init();
